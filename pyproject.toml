[project]
name = "vajacpm"
version = "0.1.0"
description = "Thai voice-cloning TTS via LoRA fine-tuning of VoxCPM 2 on dubbing-ai/vaja-thai"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "VajaCPM" }]

dependencies = [
    "voxcpm",
    "torch>=2.5.0",
    "torchaudio>=2.5.0",
    "datasets>=3.0.0",
    "huggingface-hub>=0.25.0",
    "soundfile>=0.12.1",
    "numpy>=1.26",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "pythainlp>=5.0.4",
    "bitsandbytes>=0.43.0",
    "peft>=0.13.0",
    "tensorboard>=2.17",
]

[project.optional-dependencies]
eval = [
    "transformers>=4.45",
    "jiwer>=3.0",
]
dev = [
    "ruff>=0.6",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:torch.*",
    "ignore::UserWarning:torchaudio.*",
]
