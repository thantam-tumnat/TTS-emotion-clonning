# LoRA fine-tuning recipe for SiangTTS on a single RTX 3090 24 GB.
# See RESEARCH.md §8.1–§8.2 for the reasoning behind each value.
#
# Keys under `lora:` map 1:1 to voxcpm.model.voxcpm2.LoRAConfig.
# VoxCPM2's AudioVAE *encodes* at 16 kHz and *decodes* at 48 kHz — manifests are
# resampled to `sample_rate` (16 kHz) at load time; `out_sample_rate` is only the
# rate of generated audio (TensorBoard snapshots, inference output).

# Local directory with the VoxCPM2 snapshot, or an HF repo id (auto-downloaded).
pretrained_path: openbmb/VoxCPM2
sample_rate: 16000        # AudioVAE encoder input rate (must match audio_vae_config)
out_sample_rate: 48000    # AudioVAE decoder output rate

manifests:
  train:
    - path: data/vaja/train.jsonl
      weight: 1.0
    - path: data/libritts/train.jsonl
      weight: 0.25      # ~20% of effective batch is EN
  val:
    - path: data/vaja/val.jsonl
    - path: data/libritts/val.jsonl

lora:                     # → voxcpm LoRAConfig
  enable_lm: true         # LoRA on base_lm (TSLM) + residual_lm (RALM)
  enable_dit: true        # LoRA on LocDiT estimator
  enable_proj: false
  r: 64
  alpha: 128
  dropout: 0.05

optim:
  optimizer: adamw        # or adamw_8bit (bitsandbytes)
  lr: 1.0e-4
  weight_decay: 0.0
  warmup_steps: 100

train:
  batch_size: 2
  gradient_accumulation_steps: 8   # effective batch 16
  max_batch_tokens: 4096           # drop samples longer than this / batch_size
  num_epochs: 3
  num_workers: 4
  max_grad_norm: 1.0
  save_every_steps: 1000
  eval_every_steps: 1000
  log_every_steps: 50
  lambdas:
    loss/diff: 1.0
    loss/stop: 1.0

monitor:
  tensorboard:
    enabled: true
    log_dir: runs/siangtts-lora-v0
    flush_every_steps: 100
  audio_sampler:
    enabled: true
    every_steps: 1000               # synth a few prompts and write to TB Audio tab
    prompts: eval/prompts_listen.tsv
    sample_rate: 48000              # decoder output rate
    max_prompts: 6                   # cap per snapshot to stay light
    cfg_value: 2.5
    inference_timesteps: 10
  timing:
    enabled: true
    summary_path: runs/siangtts-lora-v0/training_summary.json
    log_gpu_stats: true              # records GPU name + VRAM peak per checkpoint

augment:
  thai_digit:
    p_full: 0.4
    p_partial: 0.1
  en_text_original_vs_normalized:
    p_normalized: 0.3              # 70% raw text_original, 30% text_normalized
  whitespace_jitter:
    p: 0.15
  case_jitter:
    p: 0.1

paths:
  checkpoint_dir: checkpoints/siangtts-lora-v0
  log_dir: runs/siangtts-lora-v0
